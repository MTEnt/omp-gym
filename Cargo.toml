[workspace]
resolver = "2"
members = [
    "crates/omp-gym-core",
    "crates/omp-gym",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/MTEnt/omp-gym"
authors = ["MTEnt"]

[workspace.dependencies]
omp-gym-core = { path = "crates/omp-gym-core" }
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
fs2 = "0.4"
libc = "0.2"
regex = "1"
serde_yaml = "0.9"
sha2 = "0.10"
similar = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
wait-timeout = "0.2"
